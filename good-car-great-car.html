<title>좋은 차 위대한 차</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap">
<style>
/* Layout: one column, max 480px — ledger bar / customer counter / scene (showroom → press → body → paint → trim → showroom) / parts shelf. Garage sticker look: concrete ground, ink outlines, safety-orange accent. Single deliberate light look. */
:root {
  --bg: #cfd6dc;
  --panel: #f3f5f6;
  --ink: #18212b;
  --muted: #56636f;
  --accent: #ff7a1a;
  --accent-ink: #2a1300;
  --good: #1f9d55;
  --warn: #e0a800;
  --bad: #d63a2f;
  --font-display: "Black Han Sans", "IBM Plex Sans KR", system-ui, sans-serif;
  --font-body: "IBM Plex Sans KR", system-ui, -apple-system, "Malgun Gothic", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  background-image: radial-gradient(rgba(24,33,43,.07) 1px, transparent 1px);
  background-size: 14px 14px;
  color: var(--ink);
  font-family: var(--font-body);
  -webkit-tap-highlight-color: transparent;
}
.app {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  padding-block: 12px 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 10px;
}
.app.shake { animation: shake .35s; }
@keyframes shake {
  0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(7px); }
  60% { transform: translateX(-5px); } 80% { transform: translateX(3px); }
}
#game { display: contents; }
.card { background: var(--panel); border: 3px solid var(--ink); border-radius: 14px; box-shadow: 4px 4px 0 var(--ink); }

/* ---------- ledger bar ---------- */
.hud { display: grid; grid-template-columns: 1fr auto auto; gap: 4px 12px; align-items: end; padding: 8px 12px; font-variant-numeric: tabular-nums; }
.hud .date { grid-column: 1 / -1; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; font-weight: 700; border-bottom: 2px dashed var(--muted); padding-bottom: 4px; }
.hud .date span:last-child { color: var(--muted); }
.lbl { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
.val { font-family: var(--font-display); font-size: clamp(19px, 5.6vw, 24px); line-height: 1.05; }
.rating .val { color: var(--accent); -webkit-text-stroke: .6px var(--ink); }
.rating.danger .val { color: var(--bad); }
.right { text-align: right; }

/* ---------- customer ---------- */
.counter { padding: 10px 12px; display: grid; gap: 8px; position: relative; }
.cust-row { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: center; }
.face { width: clamp(50px, 15vw, 62px); aspect-ratio: 1; background: #fff; border: 3px solid var(--ink); border-radius: 50%; overflow: hidden; }
.face svg { display: block; width: 100%; height: 100%; }
.bubble { position: relative; min-width: 0; background: #fff; border: 3px solid var(--ink); border-radius: 12px; padding: 8px 12px; min-height: 52px; cursor: pointer; }
.bubble::before { content: ""; position: absolute; left: -11px; top: 50%; margin-top: -8px; border: 8px solid transparent; border-right: 9px solid var(--ink); border-left: 0; }
.say { margin: 0; font-weight: 600; font-size: clamp(14px, 4.1vw, 16px); line-height: 1.55; word-break: keep-all; }
.say.good { color: var(--good); font-weight: 700; }
.say.bad { color: var(--bad); font-weight: 700; }
.say .caret { display: inline-block; width: .5em; animation: blink .7s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.stars { font-size: 18px; letter-spacing: 1px; color: var(--accent); -webkit-text-stroke: .5px var(--ink); }
.stars .off { color: #d9dde1; }
.quote { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.quote b { color: var(--ink); font-size: 14px; }
.gauge { height: 12px; border: 2px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; }
.gauge i { display: block; height: 100%; width: 100%; background: var(--good); }
.gauge.mid i { background: var(--warn); }
.gauge.low i { background: var(--bad); }
.float {
  position: absolute; right: 16px; top: 4px; pointer-events: none; z-index: 5;
  font-family: var(--font-display); font-size: clamp(22px, 7vw, 30px); color: var(--good);
  -webkit-text-stroke: 1px var(--ink); animation: floatup 1.1s ease-out forwards;
}
.float.cut { color: var(--bad); }
@keyframes floatup { from { transform: translateY(10px); opacity: 0; } 15% { opacity: 1; } to { transform: translateY(-40px); opacity: 0; } }

/* ---------- scene ---------- */
.bay { padding: 10px 12px 12px; display: grid; gap: 8px; }
.line { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
.line .st { text-align: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 3px 2px; border: 2px dashed var(--muted); border-radius: 8px; white-space: nowrap; }
.line .st small { display: block; font-size: 10px; font-weight: 600; letter-spacing: .04em; }
.line .st.done { color: var(--good); border-color: var(--good); border-style: solid; background: #e6f6ec; }
.line .st.now { color: var(--accent-ink); background: var(--accent); border: 2px solid var(--ink); }
.stagebox { position: relative; border: 3px solid var(--ink); border-radius: 10px; overflow: hidden; background: #e6eaee; }
.stagebox.over { outline: 4px dashed var(--accent); outline-offset: -8px; }
#scene { display: block; width: 100%; height: auto; touch-action: none; user-select: none; -webkit-user-select: none; }
.seamhint { animation: dash 0.8s linear infinite; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.bob { animation: bob .32s ease-in-out infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.spin { animation: spin .35s linear infinite; transform-box: fill-box; transform-origin: center; }
@keyframes spin { to { transform: rotate(360deg); } }
.hint { margin: 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--muted); min-height: 1.4em; word-break: keep-all; }
.hint b { color: var(--ink); }
.meter { height: 10px; border: 2px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .1s; }
.titlecard {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  background: var(--ink); color: #fff; border-radius: 10px; padding: 8px 18px; text-align: center;
  font-family: var(--font-display); font-size: clamp(20px, 6vw, 28px); pointer-events: none;
  animation: card 1s ease forwards;
}
.titlecard small { display: block; font-family: var(--font-body); font-size: 11px; letter-spacing: .14em; color: var(--accent); font-weight: 700; }
@keyframes card { 0% { opacity: 0; transform: translate(-50%, -30%); } 20%, 75% { opacity: 1; transform: translate(-50%, -50%); } 100% { opacity: 0; transform: translate(-50%, -60%); } }
.toast {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%);
  background: #fff; border: 2px solid var(--ink); border-radius: 99px; padding: 4px 12px;
  font-size: 12px; font-weight: 700; white-space: nowrap; pointer-events: none; animation: toast 1.6s ease forwards;
}
@keyframes toast { 0% { opacity: 0; } 10%, 80% { opacity: 1; } 100% { opacity: 0; } }

/* contract document over the showroom */
.doc {
  position: absolute; left: 4%; top: 6%; width: min(56%, 250px);
  background: #fffdf6; border: 2px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink);
  padding: 8px 10px; font-size: 11px; line-height: 1.45; transform-origin: bottom center;
  animation: docin .35s ease-out;
}
@keyframes docin { from { transform: translateY(30px) rotate(-4deg); opacity: 0; } to { transform: none; opacity: 1; } }
.doc h3 { margin: 0 0 4px; font-family: var(--font-display); font-weight: 400; font-size: 15px; display: flex; justify-content: space-between; align-items: baseline; }
.doc h3 span { font-family: var(--font-body); font-size: 10px; color: var(--muted); }
.doc dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 8px; margin: 0; font-variant-numeric: tabular-nums; }
.doc dt { color: var(--muted); } .doc dd { margin: 0; font-weight: 700; text-align: right; }
.sign { margin-top: 6px; height: 46px; border: 2px dashed var(--muted); border-radius: 6px; display: grid; place-items: center; color: var(--muted); font-weight: 600; position: relative; }
.sign.over { border-color: var(--accent); background: #fff1e4; }
.stamp {
  position: absolute; width: 42px; height: 42px; border: 3px solid var(--bad); border-radius: 50%;
  color: var(--bad); display: grid; place-items: center; font-family: var(--font-display); font-size: 13px; line-height: 1;
  transform: rotate(-12deg); animation: stamp .25s ease-out;
}
@keyframes stamp { from { transform: scale(2) rotate(-12deg); opacity: 0; } to { transform: scale(1) rotate(-12deg); opacity: .9; } }

/* ---------- parts shelf ---------- */
.shelf { padding: 10px 12px 12px; display: grid; gap: 10px; }
.shelf h4 { margin: 0; font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; display: flex; justify-content: space-between; }
.tray { display: grid; grid-template-columns: repeat(auto-fit, minmax(72px, 1fr)); gap: 8px; }
.part {
  position: relative; min-height: 76px; padding: 4px 4px 6px;
  font: inherit; font-weight: 700; font-size: 13px; color: var(--ink);
  background: #fff; border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
  cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none;
  display: grid; grid-template-rows: 1fr auto; justify-items: center; align-items: center; gap: 2px;
}
.part svg { width: 100%; max-width: 64px; height: 40px; pointer-events: none; }
.part .k { position: absolute; top: 2px; left: 6px; font-size: 10px; color: var(--muted); }
.part.sel { background: #fff1e4; outline: 3px solid var(--accent); outline-offset: -8px; }
.part:active { cursor: grabbing; }
.part:focus-visible, .btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.part.dragging { opacity: .35; }
.dragghost {
  position: fixed; left: 0; top: 0; z-index: 60; pointer-events: none; width: 84px; height: 60px;
  display: grid; place-items: center; filter: drop-shadow(3px 5px 0 rgba(24,33,43,.35));
}
.dragghost svg { width: 100%; height: 100%; }
.actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
.btn {
  min-height: 52px; padding: 6px 4px;
  font: inherit; font-weight: 700; font-size: clamp(14px, 4vw, 16px); color: var(--ink);
  background: var(--panel); border: 3px solid var(--ink); border-radius: 12px; box-shadow: 0 4px 0 var(--ink);
  cursor: pointer; touch-action: manipulation; user-select: none;
  display: grid; place-items: center; line-height: 1.2;
}
.btn small { display: block; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: .06em; }
.btn:active:not(:disabled), .btn.pressed { transform: translateY(3px); box-shadow: 0 1px 0 var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.go { background: var(--accent); color: var(--accent-ink); }
.btn.go small { color: var(--accent-ink); opacity: .7; }
.btn.go.ready { animation: ready 1s ease-in-out infinite; }
@keyframes ready { 50% { box-shadow: 0 4px 0 var(--ink), 0 0 0 5px rgba(255,122,26,.35); } }
.btn.warn { background: #fdecea; }

/* ---------- result card ---------- */
.result { padding: 12px; display: grid; gap: 10px; }
.result h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 22px; }
.checks { display: grid; gap: 6px; margin: 0; padding: 0; list-style: none; }
.checks li { display: grid; grid-template-columns: auto 1fr; gap: 2px 8px; padding: 6px 8px; border: 2px solid var(--good); border-radius: 8px; background: #e6f6ec; font-size: 13px; }
.checks li.no { border-color: var(--bad); background: #fdecea; }
.checks .mk { grid-row: span 2; font-weight: 700; font-size: 16px; align-self: center; }
.checks .clue { font-weight: 600; word-break: keep-all; }
.checks .ans { color: var(--muted); }
.checks .ans b { color: var(--ink); }
.free { font-size: 12px; color: var(--muted); margin: 0; }
.bill { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; font-size: 14px; font-variant-numeric: tabular-nums; border-top: 2px dashed var(--muted); padding-top: 8px; }
.bill .minus { color: var(--bad); } .bill .plus { color: var(--good); }
.bill .total { font-weight: 700; font-size: 16px; border-top: 2px solid var(--ink); padding-top: 4px; }

/* ---------- screens ---------- */
.screen { padding: 22px 18px; display: grid; gap: 14px; text-align: center; }
.screen h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(32px, 10.5vw, 46px); line-height: 1.08; text-wrap: balance; }
.screen h1 em { font-style: normal; color: var(--accent); -webkit-text-stroke: 1.5px var(--ink); }
.screen .sub { margin: 0; color: var(--muted); font-weight: 600; text-wrap: balance; word-break: keep-all; }
.screen .hero svg { width: 100%; height: auto; display: block; }
.rules { margin: 0; padding: 10px 14px; border: 2px dashed var(--muted); border-radius: 10px; font-size: 13px; color: var(--muted); text-align: left; line-height: 1.65; word-break: keep-all; }
.rules b { color: var(--ink); }
.rules ol { margin: 0; padding-left: 18px; }
.screen .btn { min-height: 58px; font-size: 18px; }
.btns { display: grid; gap: 10px; }
.big { font-family: var(--font-display); font-size: clamp(40px, 13vw, 58px); line-height: 1; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stats div { border: 2px solid var(--ink); border-radius: 10px; padding: 8px 4px; background: #fff; min-width: 0; }
.stats b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(18px, 5.5vw, 22px); font-variant-numeric: tabular-nums; }
.stats span { font-size: 11px; color: var(--muted); font-weight: 600; }
.reviews { display: grid; gap: 6px; text-align: left; }
.reviews div { background: #fff; border: 2px solid var(--ink); border-radius: 10px; padding: 6px 10px; font-size: 13px; word-break: keep-all; }
.reviews .stars { font-size: 13px; margin-right: 6px; }
.progress { height: 14px; border: 2px solid var(--ink); border-radius: 99px; background: #fff; overflow: hidden; }
.progress i { display: block; height: 100%; background: repeating-linear-gradient(135deg, var(--accent) 0 8px, #ff9a4d 8px 16px); }
.verdict { font-family: var(--font-display); font-size: 22px; padding: 6px 14px; border: 3px solid var(--ink); border-radius: 99px; justify-self: center; background: var(--panel); }
.verdict.great { background: var(--accent); } .verdict.bad { background: #f6c6c1; }

/* start splash */
.splash-art { border: 3px solid var(--ink); border-radius: 12px; overflow: hidden; background: #dfe6ec; }
.splash-art svg { display: block; width: 100%; height: auto; }
.drive-loop { animation: driveloop 4.2s linear infinite; }
.drive-loop.b { animation-delay: -2.1s; }
@keyframes driveloop { from { transform: translateX(-430px); } to { transform: translateX(430px); } }
.road { animation: road .5s linear infinite; }
@keyframes road { to { stroke-dashoffset: -32; } }
.btn.start { min-height: 72px; font-family: var(--font-display); font-weight: 400; font-size: 30px; letter-spacing: .12em; }
.blink { margin: 0; font-size: 12px; font-weight: 700; letter-spacing: .3em; color: var(--muted); animation: blink 1.1s steps(1) infinite; }
.mini {
  font: inherit; font-size: 11px; font-weight: 700; color: var(--ink); background: #fff;
  border: 2px solid var(--ink); border-radius: 99px; padding: 2px 10px; min-height: 26px; cursor: pointer;
}
.mini.on { background: var(--accent); }
.mini:disabled { opacity: .4; cursor: default; }
.date .right-side { display: flex; align-items: center; gap: 8px; }
/* unlock ladder */
.unlocks { display: grid; gap: 6px; text-align: left; }
.unlocks div { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 6px 10px; border: 2px dashed var(--muted); border-radius: 10px; font-size: 13px; background: #fff; }
.unlocks div.on { border: 2px solid var(--good); background: #e6f6ec; }
.unlocks b { font-weight: 700; } .unlocks small { color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
.unlocks .bar { grid-column: 1 / -1; height: 6px; border-radius: 99px; background: #e3e7eb; overflow: hidden; }
.unlocks .bar i { display: block; height: 100%; background: var(--accent); }
.unlocked-news { padding: 8px 10px; border: 3px solid var(--ink); border-radius: 10px; background: var(--accent); color: var(--accent-ink); font-weight: 700; text-align: center; animation: docin .4s ease-out; }
.part.locked { background: #e9ecef; cursor: not-allowed; opacity: 1; }
.part.locked svg { opacity: .3; filter: grayscale(1); }
.part.locked .lock { position: absolute; top: 18px; left: 50%; transform: translateX(-50%); font-size: 10px; font-weight: 700; background: var(--ink); color: #fff; border-radius: 99px; padding: 1px 6px; white-space: nowrap; }
.part .prem { position: absolute; top: 2px; right: 6px; font-size: 10px; color: var(--accent); font-weight: 700; }

.flash { position: fixed; inset: 0; pointer-events: none; opacity: 0; z-index: 50; }
.flash.good { background: var(--good); animation: flash .4s; }
.flash.bad { background: var(--bad); animation: flash .45s; }
@keyframes flash { 0% { opacity: .3; } 100% { opacity: 0; } }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition: none !important; }
}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
<linearGradient id="metal" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3e7eb"/><stop offset=".5" stop-color="#b9c1c8"/><stop offset="1" stop-color="#8f99a2"/></linearGradient>
            <linearGradient id="shade" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".4"/><stop offset=".3" stop-color="#fff" stop-opacity="0"/><stop offset=".7" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></linearGradient>
            <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#26394a"/><stop offset=".55" stop-color="#5c7f96"/><stop offset="1" stop-color="#a3c6d8"/></linearGradient>
            <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset="1" stop-color="#8e98a2"/></linearGradient>
            <radialGradient id="soft"><stop offset="0" stop-color="#fff"/><stop offset=".65" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
            <radialGradient id="glow"><stop offset="0" stop-color="#fff7c2"/><stop offset=".4" stop-color="#ffb347"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
            <pattern id="hazard" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="7" height="14" fill="#f2c21b"/><rect x="7" width="7" height="14" fill="#1b1f24"/></pattern>
            <mask id="pm" maskUnits="userSpaceOnUse" x="-60" y="-60" width="520" height="300"><g id="pmDots"></g></mask>
          </defs>
</svg>
<div class="app" id="app">
  <section class="card screen" id="screen"></section>

  <div id="game" hidden>
    <header class="card hud">
      <div class="date"><span id="dateVal">1월 1일 · 겨울</span><span class="right-side"><span id="dayVal">영업 1일째 / 365</span><button class="mini" type="button" id="closeBtn">조기 마감</button></span></div>
      <div><div class="lbl">통장</div><div class="val" id="moneyVal">0원</div></div>
      <div class="right"><div class="lbl">손님</div><div class="val" id="custVal">1/10</div></div>
      <div class="right rating" id="ratingBox"><div class="lbl">가게 평점</div><div class="val" id="ratingVal">★4.0</div></div>
    </header>

    <section class="card counter" id="counter">
      <div class="cust-row">
        <div class="face" id="face"></div>
        <div class="bubble" id="bubble" aria-live="polite"><p class="say" id="say"></p><div class="stars" id="custStars" hidden></div></div>
      </div>
      <div class="quote" id="quoteRow" hidden>
        <span>예정가 <b id="quoteVal">0원</b></span>
        <div class="gauge" id="gauge"><i id="gaugeFill"></i></div>
        <span id="tipVal">빠른 팁 0초</span>
      </div>
    </section>

    <section class="card bay">
      <div class="line" id="line"></div>
      <div class="stagebox" id="stagebox">
        <svg id="scene" viewBox="0 0 400 230" aria-label="작업장">
          <g id="bg"></g>
          <g id="custLayer"></g>
          <g id="carMove" style="transition: transform .55s cubic-bezier(.5,0,.3,1)"><g id="carG" transform="translate(40 70) scale(.8)"></g></g>
          <g id="fg"></g>
          <g id="fx"></g>
        </svg>
        <div id="overlay"></div>
      </div>
      <div class="meter" id="meter" hidden><i id="meterFill"></i></div>
      <p class="hint" id="hint"></p>
    </section>

    <section class="card shelf" id="shelf">
      <h4><span id="shelfTitle">부품 선반</span><span>끌어서 놓거나 눌러서 장착</span></h4>
      <div class="tray" id="tray"></div>
      <div class="actions">
        <button class="btn warn" type="button" id="scrapBtn">폐차 <small>Backspace</small></button>
        <button class="btn go" type="button" id="mainBtn">다음 <small>Enter</small></button>

  let phase = 'title', station = 0, busy = false, last = 0, scrapArmed = 0;
  let build = null;
  let weld = null;   // { cells:[x...], done:Set }
  let paint = null;  // { cells:[[x,y]...], done:Set, color }

  function load() {
    try {
      const s = JSON.parse(localStorage.getItem(SAVE_KEY));
      if (!s || !s.day) return null;
      if (!Array.isArray(s.unlocked)) s.unlocked = [];
      return s;
    } catch (e) { return null; }
  }
  function checkUnlocks() {
    const fresh = UNLOCKS.filter(u => !G.unlocked.includes(u.id) && G.money >= u.need);
    fresh.forEach(u => G.unlocked.push(u.id));
    return fresh;
  }
  function unlockLadder() {
    return `<div class="unlocks">${UNLOCKS.map(u => {
      const on = G.unlocked.includes(u.id);
      return `<div class="${on ? 'on' : ''}"><span>${on ? '✓' : '🔒'}</span><b>${u.name}</b><small>${on ? `해금 · 차값 +${won(PREMIUM[u.id])}` : `자산 ${won(u.need)}`}</small>
        ${on ? '' : `<span class="bar"><i style="width:${Math.max(0, Math.min(100, G.money / u.need * 100))}%"></i></span>`}</div>`;
    }).join('')}</div>`;
  }
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(G)); } catch (e) {} }
  function wipe() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  const freshRun = () => ({ day: 1, money: 0, reviews: [4, 4, 4, 4, 4], served: 0, perfect: 0, unlocked: [] });
  const rating = () => G.reviews.reduce((a, b) => a + b, 0) / G.reviews.length;
  const freshBuild = () => ({ body: null, roof: null, welded: false, color: null, top: null, wheels: [null, null], extra: 'none' });
  const wheelValue = () => build.wheels[0] && build.wheels[0] === build.wheels[1] ? build.wheels[0] : 'mixed';

  // ================= orders =================
  function difficulty(day) {
    if (day <= 7) return { n: [2, 2], max: 1, min: 1 };
    if (day <= 30) return { n: [2, 3], max: 2, min: 1 };
    if (day <= 90) return { n: [3, 3], max: 2, min: 1 };
    if (day <= 180) return { n: [3, 4], max: 3, min: 2 };
    return { n: [4, 5], max: 3, min: 2 };
  }
  function makeOrder(day) {
    const cfg = difficulty(day), season = seasonOf(day);
    const target = cfg.n[0] + rnd(cfg.n[1] - cfg.n[0] + 1);
    const offered = f => Object.values(f.c).every(vals => vals.some(isUnlocked));
    const isPremiumLine = f => Object.values(f.c).some(vals => vals.every(v => PREMIUM[v]));
    const pool = shuffle(BANK.filter(f => offered(f) && f.t <= cfg.max && (f.t >= cfg.min || Math.random() < 0.15 || isPremiumLine(f)) && (!f.s || f.s === season)));
    const seasonal = pool.findIndex(f => f.s);
    if (seasonal > 0 && Math.random() < 0.5) pool.unshift(pool.splice(seasonal, 1)[0]);
    // unlocked premium parts show up in about a third of orders
    const prem = pool.findIndex(isPremiumLine);
    if (prem > 0 && Math.random() < 0.35) pool.unshift(pool.splice(prem, 1)[0]);
    const want = {}, frags = [];
    let count = 0;
    for (const f of pool) {
      const keys = Object.keys(f.c);
      if (keys.some(k => want[k]) || count + keys.length > target) continue;
      const merged = { ...want, ...f.c };
      if (merged.extra && merged.extra.join() === 'rack' && merged.roof && merged.roof.join() === 'open') continue;
      Object.assign(want, f.c); frags.push(f); count += keys.length;
      if (count >= target) break;
    }
    const text = [pick(OPENERS), ...frags.map(f => f.txt), count < ORDER_ATTRS.length ? CLOSER : ''].filter(Boolean).join(' ');
    const premium = Object.values(want).reduce((a, vals) => a + (vals.every(v => PREMIUM[v]) ? Math.max(...vals.map(v => PREMIUM[v])) : 0), 0);
    const quote = round100(1500 + 700 * count + 250 * frags.reduce((a, f) => a + f.t, 0) + premium);
    return { frags, want, count, text, quote, premium, tipWindow: 30 + 8 * count, elapsed: 0 };
  }

  // ================= screens =================

        <rect x="236" y="22" width="150" height="30" rx="4" fill="${INK}"/>
        <text x="311" y="43" text-anchor="middle" font-family="Black Han Sans, sans-serif" font-size="15" fill="#ff7a1a">좋은 차 위대한 차</text>

        <g class="drive-loop"><g transform="translate(0 4) scale(.62) translate(0 92)">${carMarkup(a)}</g></g>
        <g class="drive-loop b"><g transform="translate(0 4) scale(.62) translate(0 92)">${carMarkup(b)}</g></g>

  function titleScreen() {
    phase = 'title';
    const saved = load(), date = saved ? dateOf(saved.day) : null;
    showScreen(`
      <h1>좋은 차 <em>위대한 차</em></h1>
      ${heroCar()}
      <p class="sub">손님의 아리송한 주문을 알아듣고, 프레스부터 의장까지 손수 차를 만들어 1년 동안 가게를 지키세요.</p>
      <div class="rules"><ol>
        <li>손님과 <b>계약서에 직인</b>을 찍으면 공정이 시작돼요.</li>

        <li>요구 하나를 놓칠 때마다 예정가의 ${CUT_PER_MISS * 100}%가 깎이고 리뷰 별점도 떨어져요. 빨리 완벽하게 만들면 팁 ${TIP_RATE * 100}%.</li>
        <li>하루 손님은 최대 ${PER_DAY}명. 힘들면 <b>조기 마감</b>해도 돼요. 마감 때 평점이 ★${CLOSE_BELOW} 밑이면 폐업. 목표는 <b>${YEAR}일</b>!</li>
        <li>통장 자산이 쌓이면 <b>슈퍼카·리무진·캠핑카 금형과 은색·금색 도료</b>가 해금돼요. 해금 옵션이 들어간 차는 훨씬 비싸게 팔려요.</li>

        <button class="btn ${saved ? '' : 'go'}" type="button" data-act="new">${saved ? '새로 개업하기 (기록 삭제)' : '개업하기'} <small>${saved ? '' : 'Enter'}</small></button>
      </div>`);
  }
  function dayStartScreen() {
    phase = 'daystart';
    checkUnlocks();
    save();
    const { m, d } = dateOf(G.day), season = seasonOf(G.day), r = rating();
    const tips = { spring: '봄 손님은 꽃과 바람 이야기를 자주 해요.', summer: '여름 손님은 바다와 장마 이야기를 자주 해요.', autumn: '가을 손님은 단풍과 김장 이야기를 자주 해요.', winter: '겨울 손님은 눈과 스키 이야기를 자주 해요.' };
    showScreen(`
      <p class="sub">영업 ${G.day}일째 / ${YEAR}</p>
      <h1>${m}월 ${d}일 <em>${SEASON[season]}</em></h1>
      <div class="progress" aria-label="1년 진행률"><i style="width:${(G.day - 1) / YEAR * 100}%"></i></div>
      <div class="stats">
        <div><b>${won(G.money)}</b><span>통장</span></div>
        <div><b>★${r.toFixed(1)}</b><span>가게 평점</span></div>
        <div><b>${PER_DAY}명</b><span>오늘 손님</span></div>
      </div>
      <p class="sub">${tips[season]}${r < 3 ? ' 평점이 위험해요. 오늘은 꼼꼼하게!' : ''}</p>
      <button class="btn go" type="button" data-act="open">셔터 올리기 <small>Enter</small></button>
      <p class="sub">공방 해금 현황</p>
      ${unlockLadder()}`);
  }
  function act(a) {
    if (a === 'menu') titleScreen();
    else if (a === 'continue') { G = load() || freshRun(); dayStartScreen(); }
    else if (a === 'new') { wipe(); G = freshRun(); save(); dayStartScreen(); }
    else if (a === 'open') startDay();
    else if (a === 'tomorrow') dayStartScreen();
  }

  // ================= day flow =================
  let person = null;
  function startDay() {
    D = { n: 0, earned: 0, stars: [], perfect: 0, quotes: [], ratingBefore: rating() };
    $('screen').hidden = true;
    $('game').hidden = false;
    setScene('showroom');
    $('custLayer').innerHTML = '';
    person = null;
    nextCustomer();
  }

  function placePerson(x, mood, walking) {
    $('custLayer').innerHTML = `<g id="pWrap" style="transform: translate(${x}px, 190px); transition: transform 1s linear"><g class="${walking ? 'bob' : ''}" id="pBody">${personMarkup(person, mood)}</g></g>`;
  }
  function walkTo(x, ms) {
    const w = $('pWrap');
    if (!w) return wait(0);
    $('pBody').classList.add('bob');
    w.style.transition = `transform ${ms}ms linear`;
    requestAnimationFrame(() => { w.style.transform = `translate(${x}px, 190px)`; });
    return wait(ms).then(() => { const b = $('pBody'); if (b) b.classList.remove('bob'); });
  }
  function setMood(mood) { const b = $('pBody'); if (b) b.innerHTML = personMarkup(person, mood); $('face').innerHTML = avatarSvg(person, mood); }

  async function nextCustomer() {
    busy = true;
    D.n++;
    C = makeOrder(G.day);
    build = freshBuild();
    weld = null; paint = null;
    station = 0;
    phase = 'arrive';
    renderCloseBtn();
    setHint('손님이 들어오고 있어요… <b>말풍선</b>을 누르면 바로 들을 수 있어요');
    $('meter').hidden = true;
    $('pmDots').innerHTML = '';
    if (person && $('pWrap')) await walkTo(460, 700);
    person = newPerson();
    setScene('showroom');
    $('carG').innerHTML = '';
    $('overlay').innerHTML = '';
    $('result').hidden = true;
    $('shelf').hidden = false;
    $('quoteRow').hidden = true;
    $('custStars').hidden = true;
    $('say').className = 'say';
    $('say').textContent = '';
    $('face').innerHTML = avatarSvg(person, 'neutral');
    renderHud();
    renderLine();
    renderShelf();
    placePerson(470, 'neutral', true);
    await walkTo(262, 1000);
    busy = false;
    typeOut(C.text, () => openContract());
  }

  let typer = null;
  function typeOut(text, done) {
    const say = $('say');
    let i = 0;
    clearInterval(typer);
    typer = setInterval(() => {
      i++;
      say.innerHTML = text.slice(0, i).replace(/</g, '&lt;') + (i < text.length ? '<span class="caret">▌</span>' : '');
      if (i >= text.length) { clearInterval(typer); typer = null; done && done(); }
    }, 26);
    typeOut.finish = () => { if (!typer) return; clearInterval(typer); typer = null; say.textContent = text; done && done(); };
  }

  function openContract() {
    if (phase !== 'arrive') return;
    phase = 'contract';
    const { m, d } = dateOf(G.day);
    $('overlay').innerHTML = `
      <div class="doc" id="doc">
        <h3>주문 계약서 <span>No. ${m}${String(d).padStart(2, '0')}-${String(D.n).padStart(2, '0')}</span></h3>
        <dl>
          <dt>예정가</dt><dd>${won(C.quote)}</dd>
          ${C.premium ? `<dt>프리미엄 옵션</dt><dd>+${won(C.premium)} 포함</dd>` : ''}
          <dt>공정</dt><dd>프레스→차체→도장→의장</dd>
          <dt>빠른 출고 팁</dt><dd>${C.tipWindow}초 안 +${TIP_RATE * 100}%</dd>
          <dt>해석 실수</dt><dd>1건당 −${CUT_PER_MISS * 100}%</dd>
        </dl>
        <div class="sign" id="signBox">공장 직인</div>
      </div>`;
    renderShelf();
    setHint('선반의 <b>직인</b>을 계약서 서명란에 끌어다 찍으세요');
  }

  async function signContract() {
    if (phase !== 'contract' || busy) return;
    busy = true;
    const box = $('signBox');
    box.innerHTML = '<div class="stamp">좋은차<br>직인</div>';
    setMood('happy');
    await wait(650);
    setMood('neutral');
    $('quoteRow').hidden = false;
    $('quoteVal').textContent = won(C.quote);
    phase = 'build';
    station = 0;
    await enterStation(0, true);
    busy = false;
  }

  // ================= stations =================
  function setScene(kind) {
    const s = sceneMarkup(kind);
    $('bg').innerHTML = s.bg;
    $('fg').innerHTML = s.fg;
    $('fx').innerHTML = '';
    $('custLayer').style.display = kind === 'showroom' ? '' : 'none';
  }
  function moveCar(x, animate) {
    const g = $('carMove');
    if (!animate) { g.style.transition = 'none'; g.style.transform = `translateX(${x}px)`; void g.getBoundingClientRect(); g.style.transition = 'transform .55s cubic-bezier(.5,0,.3,1)'; return wait(0); }
    g.style.transform = `translateX(${x}px)`;
    return wait(560);
  }
  function spinWheels(on) { $('carG').querySelectorAll('.wh').forEach(w => w.classList.toggle('spin', on)); }

  function carState() {
    return {
      body: build.body, roof: build.roof, base: build.color, top: build.top,
      welded: build.welded, seam: station === 1 && phase === 'build',
      ghostRoof: station === 1 && phase === 'build',
      slots: station === 3 && phase === 'build',
      wheels: build.wheels, extra: build.extra,
    };
  }
  function renderCar() {
    $('carG').innerHTML = carMarkup(carState());
    if (weld && station === 1) weld.done.forEach(x => addBead(x, false));
  }

  async function enterStation(i, first) {
    busy = true;
    if (!first) { spinWheels(true); await moveCar(470, true); }
    station = i;
    setScene(STATIONS[i].id);
    renderCar();
    await moveCar(-470, false);
    $('overlay').innerHTML = `<div class="titlecard"><small>STEP ${i + 1} · ${STATIONS[i].sub}</small>${i + 1}공정 · ${STATIONS[i].name}</div>`;
    renderLine();
    renderShelf();
    stationHint();
    await moveCar(0, true);
    busy = false;
    if (i === 2 && build.top) startPaintCells();
  }

  function stationHint() {
    $('meter').hidden = true;
    if (phase !== 'build') return;
    if (station === 0) setHint(build.body ? `<b>${LABEL.body[build.body]}</b> 차체가 찍혔어요. 다른 금형으로 다시 찍을 수도 있어요` : '금형을 <b>프레스 위</b>로 끌어다 놓으면 강판을 찍어요');
    if (station === 1) {
      if (!build.roof) setHint('지붕 패널을 <b>차체 위</b>로 끌어다 얹으세요');
      else if (!build.welded) { setHint('주황색 이음새를 <b>토치로 문질러</b> 용접하세요'); showMeter(weld ? weld.done.size / weld.cells.length / WELD_DONE : 0); }
      else setHint(`<b>${LABEL.roof[build.roof]}</b> 용접 완료`);
    }
    if (station === 2) {
      if (!build.top && !build.color) setHint('도료 캔을 <b>도장 부스</b>로 끌어다 놓으세요');
      else if (build.top) { setHint(`<b>${LABEL.color[build.top]}</b> 도료 장전. 차 위를 <b>문질러</b> 칠하세요`); showMeter(paint ? paint.done.size / paint.cells.length / PAINT_DONE : 0); }
      else setHint(`<b>${LABEL.color[build.color]}</b> 도장 완료. 다른 도료로 덧칠할 수도 있어요`);
    }
    if (station === 3) {
      const n = build.wheels.filter(Boolean).length;
      setHint(n < 2 ? `바퀴를 <b>휠하우스</b>에 끼우세요 (${n}/2). 장식은 차 위에 놓으면 달려요` : `바퀴 ${wheelValue() === 'mixed' ? '<b>짝짝이</b>!' : `<b>${LABEL.wheel[wheelValue()]}</b>`} · 장식 <b>${LABEL.extra[build.extra]}</b>`);
    }
  }
  function setHint(html) { $('hint').innerHTML = html; }
  function showMeter(r) { $('meter').hidden = false; $('meterFill').style.width = Math.min(100, r * 100) + '%'; }
  function toast(text) {
    const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
    $('stagebox').appendChild(t); setTimeout(() => t.remove(), 1600);
  }

  // ----- press -----
  async function pressDie(v) {
    if (busy) return;
    busy = true;
    const ram = $('ram');
    ram.style.transition = 'transform .22s ease-in';
    ram.style.transform = 'translateY(98px)';

    sparks(200, 172, 10, '#ffffff');
    await wait(160);
    ram.style.transition = 'transform .45s ease-out';
    ram.style.transform = 'translateY(0)';
    await wait(300);
    busy = false;
    afterChange();
  }

  // ----- body: roof + weld -----
  function placeRoof(v) {
    if (busy) return;
    build.roof = v;
    build.welded = false;
    const [x1, x2] = CARS[build.body].seam;
    weld = { cells: [], done: new Set() };
    for (let x = x1 + 6; x <= x2 - 6; x += 8) weld.cells.push(x);
    renderCar();
    $('carG').animate([{ transform: 'translate(40px, 66px) scale(.8)' }, { transform: 'translate(40px, 70px) scale(.8)' }], { duration: 200 });
    afterChange();
  }
  function addBead(x, hot) {
    const beads = $('beads'); if (!beads) return;
    const y = CARS[build.body].seam[2];
    const b = svgEl('circle', { cx: x, cy: y, r: 2.8, fill: hot ? '#ffd27a' : '#8a9097', stroke: hot ? '#ff7a1a' : 'none' }, beads);
    if (hot) setTimeout(() => { b.setAttribute('fill', '#8a9097'); b.setAttribute('stroke', 'none'); }, 500);
  }
  function weldAt(carX, carY) {
    if (!weld || build.welded) return;
    const y = CARS[build.body].seam[2];
    if (Math.abs(carY - y) > 16) return;
    let hit = false;
    weld.cells.forEach(x => { if (!weld.done.has(x) && Math.abs(x - carX) < 10) { weld.done.add(x); addBead(x, true); hit = true; } });
    if (hit) { const p = carToScene(carX, y); sparks(p.x, p.y, 5, '#ffcf5a'); }
    if (weld.done.size / weld.cells.length >= WELD_DONE) finishWeld(); else stationHint();
  }
  function finishWeld() {
    build.welded = true;
    flashCar('#ffd27a');
    renderCar();
    afterChange();
  }
  async function autoWeld() {
    if (busy || !weld || build.welded) return;
    busy = true;
    const y = CARS[build.body].seam[2];
    for (const x of weld.cells) {
      if (!weld.done.has(x)) { weld.done.add(x); addBead(x, true); const p = carToScene(x, y); drawTool(p.x, p.y); if (Math.random() < .5) sparks(p.x, p.y, 3, '#ffcf5a'); stationHint(); await wait(22); }
    }
    hideTool();
    busy = false;
    finishWeld();
  }

  // ----- paint -----
  function loadPaint(v) {
    if (busy) return;
    if (build.top === v) return;
    if (build.top) { $('pmDots').innerHTML = ''; }
    build.top = v;
    renderCar();
    startPaintCells();
    afterChange();
  }
  function startPaintCells() {
    $('pmDots').innerHTML = '';
    const paths = [...$('carG').querySelectorAll('path[data-paint]')].slice(0, build.roof && build.roof !== 'open' ? 2 : 1);
    const c = CARS[build.body], cells = [];
    for (let x = 22; x <= 378; x += 12) for (let y = c.top; y <= 138; y += 10) {
      let inside = true;
      try { inside = paths.some(p => p.isPointInFill(new DOMPoint(x, y))); } catch (e) { inside = y > c.top + 6; }
      if (inside) cells.push([x, y]);
    }
    paint = { cells, done: new Set() };
    stationHint();
  }
  let lastDot = null;
  function sprayAt(carX, carY, force) {
    if (!build.top || !paint) return;
    if (!force && lastDot && Math.hypot(lastDot[0] - carX, lastDot[1] - carY) < 6) return;
    lastDot = [carX, carY];
    svgEl('circle', { cx: carX.toFixed(1), cy: carY.toFixed(1), r: 30, fill: 'url(#soft)' }, $('pmDots'));
    paint.cells.forEach((cell, i) => { if (!paint.done.has(i) && Math.hypot(cell[0] - carX, cell[1] - carY) < 25) paint.done.add(i); });
    if (paint.done.size / paint.cells.length >= PAINT_DONE) finishPaint(); else stationHint();
  }
  function finishPaint() {
    build.color = build.top;
    build.top = null;
    paint = null;
    $('pmDots').innerHTML = '';
    renderCar();
    flashCar('#ffffff');
    afterChange();
  }
  async function autoSpray() {
    if (busy || !build.top) return;
    busy = true;
    const c = CARS[build.body];
    const rows = [];
    for (let y = c.top + 6; y <= 136; y += 18) rows.push(y);
    for (let r = 0; r < rows.length && build.top; r++) {
      const ltr = r % 2 === 0;
      for (let k = 0; k <= 24 && build.top; k++) {
        const x = ltr ? 18 + k * 15 : 378 - k * 15;
        sprayAt(x, rows[r], true);
        const p = carToScene(x, rows[r]); drawTool(p.x, p.y - 20);
        await wait(12);
      }
    }
    hideTool();
    if (build.top) finishPaint();
    busy = false;
  }

  // ----- trim -----
  function installWheel(i, v) {
    if (busy) return;
    build.wheels[i] = v;
    renderCar();
    const w = $('carG').querySelector(`.wh[data-i="${i}"]`);
    if (w) w.animate([{ transform: 'rotate(-240deg) scale(.6)', opacity: .3 }, { transform: 'none', opacity: 1 }], { duration: 380, easing: 'ease-out' });
    afterChange();
  }
  function setExtra(v) {
    if (busy) return;
    if (v === 'rack' && build.roof === 'open') { toast('오픈탑에는 루프랙을 달 수 없어요'); return; }
    build.extra = v;
    renderCar();
    afterChange();
  }

  function afterChange() { renderShelf(); stationHint(); }

  function stationReady() {
    if (station === 0) return !!build.body;
    if (station === 1) return !!build.roof && build.welded;
    if (station === 2) return !!build.color && !build.top;
    return build.wheels.every(Boolean);
  }

  function mainAction() {
    if (busy) return;
    if (phase === 'contract') return signContract();
    if (phase !== 'build') return;
    if (station === 1 && build.roof && !build.welded) return autoWeld();
    if (station === 2 && build.top) return autoSpray();
    if (!stationReady()) { wiggle($('mainBtn')); return; }
    if (station < 3) enterStation(station + 1);
    else deliver();
  }

  function scrap() {
    if (phase !== 'build' || busy || !build.body) return;
    const now = performance.now();
    if (now - scrapArmed > 2000) {
      scrapArmed = now;
      $('scrapBtn').innerHTML = `정말 폐차? <small>-${won(SCRAP_COST)}</small>`;
      setTimeout(() => { if (performance.now() - scrapArmed >= 2000) renderShelf(); }, 2050);
      return;
    }
    scrapArmed = 0;
    G.money -= SCRAP_COST;
    D.earned -= SCRAP_COST;
    floatText('-' + won(SCRAP_COST), true);
    build = freshBuild();
    weld = null; paint = null; $('pmDots').innerHTML = '';
    renderHud();
    enterStation(0);
  }

  // ================= delivery =================
  async function deliver() {
    busy = true;
    phase = 'deliver';
    renderShelf();
    renderLine();
    setHint('완성차를 손님에게 가져가는 중…');
    spinWheels(true);
    await moveCar(470, true);
    setScene('showroom');
    $('overlay').innerHTML = '';
    placePerson(352, 'neutral', false);
    renderCar();
    spinWheels(true);
    await moveCar(-470, false);
    await moveCar(-58, true);
    spinWheels(false);
    await wait(250);
    judge();
    busy = false;
  }

  function judge() {
    phase = 'result';
    const final = { body: build.body, roof: build.roof, color: build.color, wheel: wheelValue(), extra: build.extra };
    const rows = [];
    let misses = 0;
    C.frags.forEach(f => Object.keys(f.c).forEach(attr => {
      const ok = f.c[attr].includes(final[attr]);
      if (!ok) misses++;
      rows.push({ clue: f.txt, attr, need: f.c[attr], got: final[attr], ok });
    }));
    const cut = Math.min(C.quote, round100(C.quote * CUT_PER_MISS * misses));
    const fast = C.elapsed <= C.tipWindow;
    const tip = misses === 0 && fast ? round100(C.quote * TIP_RATE) : 0;
    // a premium part the customer left to you is sold as an upgrade at half its value
    let upgrade = 0;
    if (misses === 0) ORDER_ATTRS.forEach(a => { if (!C.want[a] && PREMIUM[final[a]]) upgrade += round100(PREMIUM[final[a]] / 2); });
    const paid = C.quote - cut + tip + upgrade;
    const stars = [5, 3, 2, 1, 1, 1][misses];
    const firstMiss = rows.find(r => !r.ok);
    const line = misses === 0 ? pick(PRAISE)
      : misses === 1 ? `${SUBJ[firstMiss.attr]} 제가 말한 거랑 달라요. 깎아 주셔야겠어요.`
      : misses === 2 ? '제 말을 절반은 흘려들으셨네요…'
      : '이건 제가 주문한 차가 아니에요!';

    G.money += paid; G.served++;
    G.reviews.push(stars); if (G.reviews.length > REVIEW_WINDOW) G.reviews.shift();
    D.earned += paid; D.stars.push(stars);
    if (misses === 0) { D.perfect++; G.perfect++; }
    D.quotes.push({ stars, line });
    const fresh = checkUnlocks();

    setMood(misses ? 'angry' : 'happy');
    const pw = $('pBody');
    if (pw) pw.animate(misses
      ? [{ transform: 'translateX(0)' }, { transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'translateX(0)' }]
      : [{ transform: 'translateY(0)' }, { transform: 'translateY(-14px)' }, { transform: 'translateY(0)' }, { transform: 'translateY(-8px)' }, { transform: 'translateY(0)' }],
      { duration: 600 });
    const mark = svgEl('text', { x: 352, y: 56, 'text-anchor': 'middle', 'font-size': 26, 'font-family': 'Black Han Sans, sans-serif', fill: misses ? '#d63a2f' : '#1f9d55', stroke: INK, 'stroke-width': 1 }, $('fx'));
    mark.textContent = misses ? '!!' : '♥';
    $('say').className = 'say ' + (misses ? 'bad' : 'good');
    $('say').textContent = line;
    $('custStars').hidden = false;
    $('custStars').innerHTML = starStr(stars);
    $('quoteRow').hidden = true;
    flash(misses ? 'bad' : 'good');
    floatText((misses ? '' : '+') + won(paid), misses > 0);
    if (misses) shake();

    const freeAttrs = ORDER_ATTRS.filter(a => !C.want[a]);
    const needText = (attr, need) => need.length >= 5
      ? `${ALL_COLORS.filter(c => !need.includes(c)).map(c => LABEL.color[c]).join('·')} 빼고 아무거나`
      : need.map(v => LABEL[attr][v]).join(' 또는 ');
    const lastOfDay = D.n >= PER_DAY || D.closing;
    $('shelf').hidden = true;
    setHint('');
    const res = $('result');
    res.hidden = false;
    res.innerHTML = `
      ${fresh.map(u => `<div class="unlocked-news">🔓 자산 ${won(u.need)} 돌파! <b>${u.name}</b> 해금 · 차값 +${won(PREMIUM[u.id])}</div>`).join('')}
      <h2>${misses === 0 ? '주문 완벽 해석!' : `요구 ${C.count}개 중 ${misses}개를 놓쳤어요`}</h2>
      <ul class="checks">${rows.map(r => `
        <li class="${r.ok ? '' : 'no'}">
          <span class="mk">${r.ok ? '✓' : '✗'}</span>
          <span class="clue">“${r.clue}”</span>
          <span class="ans">${ATTR[r.attr]}: <b>${needText(r.attr, r.need)}</b> · 만든 차: ${LABEL[r.attr][r.got]}</span>
        </li>`).join('')}</ul>
      ${freeAttrs.length ? `<p class="free">자유 선택: ${freeAttrs.map(a => ATTR[a]).join(', ')}</p>` : ''}
      <div class="bill">
        <span>예정가${C.premium ? ` (프리미엄 +${won(C.premium)} 포함)` : ''}</span><span>${won(C.quote)}</span>
        ${upgrade ? `<span>프리미엄 업그레이드 (자유 선택분)</span><span class="plus">+${won(upgrade)}</span>` : ''}
        ${cut ? `<span>해석 실수 감액 (${misses}개 × ${CUT_PER_MISS * 100}%)</span><span class="minus">-${won(cut)}</span>` : ''}
        ${tip ? `<span>빠른 출고 팁</span><span class="plus">+${won(tip)}</span>` : ''}
        ${misses === 0 && !fast ? `<span>빠른 출고 팁 (${C.tipWindow}초 초과)</span><span>0원</span>` : ''}
        <span class="total">받은 돈 · 리뷰 ${'★'.repeat(stars)}</span><span class="total">${won(paid)}</span>
      </div>
      <div class="actions">
        ${lastOfDay ? '' : '<button class="btn warn" type="button" id="earlyBtn">조기 마감</button>'}
        <button class="btn go" type="button" id="afterBtn" style="${lastOfDay ? 'grid-column: 1 / -1' : ''}">${lastOfDay ? '영업 마감' : `다음 손님 (${D.n + 1}/${PER_DAY})`} <small>Enter</small></button>
      </div>`;
    $('afterBtn').addEventListener('click', () => afterResult());
    if ($('earlyBtn')) $('earlyBtn').addEventListener('click', () => afterResult(true));
    renderCloseBtn();
    $('afterBtn').focus({ preventScroll: true });
    renderHud();
  }

  // HUD button: between customers it closes now; mid-build it closes after this car
  function closeEarly() {
    if (busy) return;
    if (phase === 'result') return afterResult(true);
    if (phase === 'arrive' || phase === 'contract') {
      clearInterval(typer); typer = null;
      D.n--;
      $('overlay').innerHTML = '';
      endDay();
      return;
    }
    if (phase === 'build' || phase === 'deliver') {
      D.closing = !D.closing;
      renderCloseBtn();
      toast(D.closing ? '이번 손님까지만 받고 마감해요' : '마감 예약을 취소했어요');
    }
  }
  function renderCloseBtn() {
    const b = $('closeBtn');
    b.textContent = D && D.closing ? '마감 예약됨' : '조기 마감';
    b.classList.toggle('on', !!(D && D.closing));
    b.disabled = phase === 'result' && D.n >= PER_DAY;
  }

  async function afterResult(forceEnd) {
    if (phase !== 'result' || busy) return;
    busy = true;
    // customer drives off with the car
    $('custLayer').innerHTML = '';
    spinWheels(true);
    await moveCar(470, true);
    $('carG').innerHTML = '';
    $('fx').innerHTML = '';
    busy = false;
    person = null;
    if (D.n < PER_DAY && !D.closing && !forceEnd) nextCustomer();
    else endDay();
  }

  function endDay() {
    const r = rating();
    const served = D.stars.length;
    const avg = served ? D.stars.reduce((a, b) => a + b, 0) / served : 0;
    const early = served < PER_DAY;
    const { m, d } = dateOf(G.day);
    const delta = r - D.ratingBefore;
    const reviews = shuffle(D.quotes.slice()).slice(0, 3).map(q => `<div><span class="stars">${starStr(q.stars)}</span>${q.line}</div>`).join('');
    const statsHtml = `<div class="stats">
        <div><b>${won(D.earned)}</b><span>오늘 수입</span></div>
        <div><b>${D.perfect}/${served}</b><span>완벽 해석</span></div>
        <div><b>${served ? '★' + avg.toFixed(1) : '—'}</b><span>오늘 별점</span></div>
      </div>`;
    if (r < CLOSE_BELOW) {
      phase = 'closed';
      wipe();
      showScreen(`
        <p class="sub">${m}월 ${d}일 · 영업 ${G.day}일째</p>
        <h1>가게 문을 닫았습니다</h1>
        <p class="sub">가게 평점이 ★${r.toFixed(1)}까지 떨어져 손님이 끊겼어요.</p>
        ${statsHtml}
        <div class="verdict bad">${G.day}일 버팀 · 통장 ${won(G.money)}</div>
        <div class="reviews">${reviews}</div>
        <button class="btn go" type="button" data-act="new">다시 개업하기 <small>Enter</small></button>`);
      return;
    }
    if (G.day >= YEAR) {
      phase = 'year';
      wipe();
      showScreen(`
        <p class="sub">12월 31일 · 영업 ${YEAR}일째</p>
        <h1>1년 영업 <em>완주!</em></h1>
        <div class="big">${won(G.money)}</div>
        <div class="stats">
          <div><b>${G.served}대</b><span>출고</span></div>
          <div><b>${Math.round(G.perfect / G.served * 100)}%</b><span>완벽 해석률</span></div>
          <div><b>★${r.toFixed(1)}</b><span>최종 평점</span></div>
        </div>
        <div class="verdict great">${r >= 4.5 ? '위대한 정비소' : '좋은 정비소'}</div>
        <button class="btn go" type="button" data-act="new">새해 다시 개업하기 <small>Enter</small></button>`);
      return;
    }
    phase = 'dayend';
    G.day++;
    save();
    showScreen(`
      <p class="sub">${m}월 ${d}일 ${early ? `조기 마감 · 손님 ${served}/${PER_DAY}명` : '영업 마감'}</p>
      <h1>${!served ? '쉬어 가는 하루' : D.perfect === served && served >= 3 ? '위대한 하루' : D.perfect / served >= 0.6 ? '좋은 하루' : '아쉬운 하루'}</h1>
      ${statsHtml}
      <p class="sub">가게 평점 ★${D.ratingBefore.toFixed(1)} → <b>★${r.toFixed(1)}</b> (${delta >= 0 ? '+' : ''}${delta.toFixed(1)})${r < 3 ? ' · 폐업 위험!' : ''}</p>
      <div class="reviews">${reviews}</div>
      <button class="btn go" type="button" data-act="tomorrow">다음 날로 <small>Enter</small></button>
      <p class="sub">공방 해금 현황 · 통장 ${won(G.money)}</p>
      ${unlockLadder()}`);
  }

  // ================= shelf (parts) =================
  function thumb(kind, v) {
    if (kind === 'seal') return `<svg viewBox="0 0 60 50"><rect x="22" y="2" width="16" height="24" rx="4" fill="#8a5a3b" stroke="${INK}" stroke-width="2"/><rect x="14" y="24" width="32" height="12" rx="3" fill="#6b4329" stroke="${INK}" stroke-width="2"/><rect x="16" y="36" width="28" height="8" fill="#d63a2f" stroke="${INK}" stroke-width="2"/></svg>`;
    if (kind === 'body') {
      const c = CARS[v];
      return `<svg viewBox="0 0 400 170"><rect x="4" y="12" width="392" height="150" rx="16" fill="#59636d" stroke="${INK}" stroke-width="6"/><path d="${c.green}" fill="#3b434b"/><path d="${c.lower}" fill="#3b434b"/><path d="${c.green} ${c.lower}" fill="none" stroke="#c3cad1" stroke-width="5"/></svg>`;
    }
    if (kind === 'roof') {
      const c = CARS[build.body] || CARS.sedan, [x1, x2] = c.seam;
      const vb = `${x1 - 12} ${c.top - 18} ${x2 - x1 + 24} ${c.belt - c.top + 30}`;
      if (v === 'open') {
        const [fx, fy, fw] = c.fold;
        return `<svg viewBox="${vb}"><path d="${c.shield}" fill="url(#glass)" stroke="${INK}" stroke-width="2"/><rect x="${(x1 + x2) / 2 - fw / 2}" y="${(c.top + c.belt) / 2}" width="${fw}" height="14" rx="7" fill="#2b2f35" stroke="${INK}" stroke-width="2"/></svg>`;
      }
      return `<svg viewBox="${vb}"><path d="${c.green}" fill="url(#metal)" stroke="${INK}" stroke-width="2.5"/><path d="${c.glass}" fill="url(#glass)" stroke="${INK}" stroke-width="1.5"/>${v === 'sunroof' ? `<rect x="${c.sun[0]}" y="${c.roofY - 4}" width="${c.sun[1] - c.sun[0]}" height="7" rx="2" fill="#2c4152" stroke="${INK}" stroke-width="1.5"/>` : ''}</svg>`;
    }
    if (kind === 'color') return `<svg viewBox="0 0 60 64"><path d="M14 14 Q30 -2 46 14" stroke="${INK}" fill="none" stroke-width="2.5"/><rect x="10" y="14" width="40" height="46" rx="4" fill="#c9cfd5" stroke="${INK}" stroke-width="2.5"/><rect x="10" y="26" width="40" height="22" fill="${PAINT[v]}" stroke="${INK}" stroke-width="1.5"/><ellipse cx="30" cy="14" rx="20" ry="5" fill="#e3e7eb" stroke="${INK}" stroke-width="2"/><path d="M16 60 V48" stroke="${PAINT[v]}" stroke-width="3"/></svg>`;
    if (kind === 'wheel') return `<svg viewBox="-32 -32 64 64">${wheelInner(v, 25)}</svg>`;
    if (v === 'rack') return `<svg viewBox="0 0 80 40"><rect x="6" y="12" width="68" height="6" rx="3" fill="#2b2f35"/><rect x="12" y="16" width="5" height="14" fill="#2b2f35"/><rect x="63" y="16" width="5" height="14" fill="#2b2f35"/><rect x="28" y="6" width="4" height="12" fill="#3a4048"/><rect x="48" y="6" width="4" height="12" fill="#3a4048"/></svg>`;
    if (v === 'spoiler') return `<svg viewBox="0 0 80 40"><rect x="18" y="16" width="5" height="18" fill="#23272c"/><rect x="56" y="16" width="5" height="18" fill="#23272c"/><path d="M6 18 L72 8 L76 16 L10 24 Z" fill="#23272c" stroke="${INK}" stroke-width="1.5"/></svg>`;
    return `<svg viewBox="0 0 80 40"><circle cx="40" cy="20" r="14" fill="none" stroke="#8a939c" stroke-width="4"/><path d="M30 10 L50 30" stroke="#8a939c" stroke-width="4"/></svg>`;
  }

  function shelfItems() {
    if (phase === 'contract') return [{ kind: 'seal', v: 'seal', label: '공장 직인' }];
    if (phase !== 'build') return [];
    const attr = ['body', 'roof', 'color', 'wheel'][station];
    const items = Object.keys(LABEL[attr]).filter(v => v !== 'mixed').map(v => {
      const u = UNLOCKS.find(x => x.id === v);
      return { kind: attr, v, label: LABEL[attr][v], locked: !isUnlocked(v), need: u ? u.need : 0, prem: PREMIUM[v] || 0 };
    });
    if (station === 3) Object.keys(LABEL.extra).forEach(v => items.push({ kind: 'extra', v, label: v === 'none' ? '장식 떼기' : LABEL.extra[v] }));
    return items;
  }
  function isSelected(it) {
    if (it.kind === 'body') return build.body === it.v;
    if (it.kind === 'roof') return build.roof === it.v;
    if (it.kind === 'color') return (build.top || build.color) === it.v;
    if (it.kind === 'wheel') return build.wheels.includes(it.v);
    if (it.kind === 'extra') return build.extra === it.v;
    return false;
  }

  let ITEMS = [];
  function renderShelf() {
    ITEMS = shelfItems();
    $('shelfTitle').textContent = phase === 'contract' ? '계약 도구' : phase === 'build' ? STATIONS[station].shelf : '대기 중';
    $('tray').innerHTML = ITEMS.map((it, i) => `
      <button class="part ${isSelected(it) ? 'sel' : ''} ${it.locked ? 'locked' : ''}" type="button" data-i="${i}" aria-label="${it.label}${it.locked ? ' 잠김' : ''}" ${it.locked ? 'aria-disabled="true"' : ''}>
        <span class="k">${i + 1}</span>${it.prem && !it.locked ? `<span class="prem">+${it.prem / 1000}천</span>` : ''}
        ${thumb(it.kind, it.v)}${it.locked ? `<span class="lock">자산 ${it.need / 10000}만</span>` : ''}<span>${it.label}</span>
      </button>`).join('');
    $('tray').querySelectorAll('.part').forEach(el => {
      const it = ITEMS[+el.dataset.i];
      if (it.locked) el.addEventListener('click', () => toast(`통장 자산 ${won(it.need)}이 되면 해금돼요`));
      else bindDrag(el, it);
    });
    // main action label
    const mb = $('mainBtn');
    let label = '다음', ready = false, disabled = false;
    if (phase === 'contract') { label = '직인 찍기'; ready = true; }
    else if (phase === 'build') {
      if (station === 1 && build.roof && !build.welded) label = '용접 로봇 돌리기';
      else if (station === 2 && build.top) label = '자동 도장 로봇';
      else if (station < 3) { label = `${STATIONS[station + 1].name} 공정으로 →`; ready = stationReady(); disabled = !ready; }
      else { label = '출고하기'; ready = stationReady(); disabled = !ready; }
    } else disabled = true;
    mb.innerHTML = `${label} <small>Enter</small>`;
    mb.disabled = disabled;
    mb.classList.toggle('ready', ready);
    const sb = $('scrapBtn');
    sb.disabled = phase !== 'build' || !build.body;
    if (performance.now() - scrapArmed > 2000) sb.innerHTML = '폐차 <small>Backspace</small>';
  }

  // tap = auto-place; drag = place where you drop
  function useItem(it) {
    if (busy || !it) return;
    if (it.locked) return toast(`통장 자산 ${won(it.need)}이 되면 해금돼요`);
    if (it.kind === 'seal') return signContract();
    if (it.kind === 'body') return pressDie(it.v);
    if (it.kind === 'roof') return placeRoof(it.v);
    if (it.kind === 'color') return loadPaint(it.v);
    if (it.kind === 'wheel') { build.wheels = [it.v, it.v]; renderCar(); $('carG').querySelectorAll('.wh').forEach(w => w.animate([{ transform: 'rotate(-240deg) scale(.6)', opacity: .3 }, { transform: 'none', opacity: 1 }], { duration: 380 })); return afterChange(); }
    if (it.kind === 'extra') return setExtra(it.v);
  }
  function dropItem(it, x, y) {
    if (busy) return;
    const sr = $('stagebox').getBoundingClientRect();
    const onStage = x >= sr.left && x <= sr.right && y >= sr.top && y <= sr.bottom;
    if (it.kind === 'seal') {
      const box = $('signBox');
      const r = box && box.getBoundingClientRect();
      if (r && x >= r.left - 10 && x <= r.right + 10 && y >= r.top - 10 && y <= r.bottom + 10) return signContract();
      return toast('직인은 서명란에 찍어 주세요');
    }
    if (!onStage) return toast('작업대 위에 놓아 주세요');
    const p = toSvg($('carG'), x, y);
    if (it.kind === 'body') return pressDie(it.v);
    if (it.kind === 'color') return loadPaint(it.v);
    const inCar = p.x > 0 && p.x < 400 && p.y > -10 && p.y < 160;
    if (it.kind === 'roof') return inCar ? placeRoof(it.v) : toast('지붕은 차체 위에 얹어 주세요');
    if (it.kind === 'extra') return inCar ? setExtra(it.v) : toast('장식은 차 위에 놓아 주세요');
    if (it.kind === 'wheel') {
      const c = CARS[build.body];
      const d = c.wx.map(wx => Math.hypot(wx - p.x, c.axle - p.y));
      const i = d[0] < d[1] ? 0 : 1;
      return d[i] < 70 ? installWheel(i, it.v) : toast('바퀴는 휠하우스에 끼워 주세요');
    }
  }

  function bindDrag(el, it) {
    let start = null, ghost = null;
    el.addEventListener('pointerdown', e => {
      if (busy || e.button > 0) return;
      start = { x: e.clientX, y: e.clientY };
      el.setPointerCapture(e.pointerId);
    });
    el.addEventListener('pointermove', e => {
      if (!start) return;
      if (!ghost && Math.hypot(e.clientX - start.x, e.clientY - start.y) > 6) {
        ghost = document.createElement('div');
        ghost.className = 'dragghost';
        ghost.innerHTML = thumb(it.kind, it.v);
        document.body.appendChild(ghost);
        el.classList.add('dragging');
      }
      if (ghost) {
        ghost.style.transform = `translate(${e.clientX - 42}px, ${e.clientY - 30}px)`;
        const sr = $('stagebox').getBoundingClientRect();
        $('stagebox').classList.toggle('over', e.clientX >= sr.left && e.clientX <= sr.right && e.clientY >= sr.top && e.clientY <= sr.bottom);
        const sb = $('signBox');
        if (sb) { const r = sb.getBoundingClientRect(); sb.classList.toggle('over', e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom); }
      }
    });
    const end = e => {
      if (!start) return;
      const wasDrag = !!ghost;
      if (ghost) { ghost.remove(); ghost = null; }
      el.classList.remove('dragging');
      $('stagebox').classList.remove('over');
      start = null;
      if (e.type === 'pointercancel') return;
      if (wasDrag) dropItem(it, e.clientX, e.clientY); else useItem(it);
    };
    el.addEventListener('pointerup', end);
    el.addEventListener('pointercancel', end);
    el.addEventListener('keydown', e => { if (e.key === ' ') { e.preventDefault(); useItem(it); } });
  }

  // ================= tools on the stage (torch, spray gun) =================
  function carToScene(x, y) { return { x: 40 + x * 0.8, y: 70 + y * 0.8 }; }
  function drawTool(x, y) {
    const fx = $('fx');
    let t = $('tool');
    if (!t) t = svgEl('g', { id: 'tool' }, fx);
    if (station === 1) t.innerHTML = `<circle r="12" fill="url(#glow)"/><path d="M2 -4 L30 -34 L36 -28 L8 2 Z" fill="#4b5560" stroke="${INK}" stroke-width="1.5"/><rect x="28" y="-46" width="12" height="16" rx="3" fill="#d63a2f" stroke="${INK}" stroke-width="1.5" transform="rotate(42 34 -38)"/>`;
    else t.innerHTML = `<path d="M0 0 L-26 -18 L-26 18 Z" fill="${PAINT[build.top] || '#ccc'}" opacity=".35"/><rect x="0" y="-7" width="26" height="14" rx="3" fill="#5d6874" stroke="${INK}" stroke-width="1.5"/><rect x="16" y="5" width="8" height="18" rx="2" fill="#3a434c" stroke="${INK}" stroke-width="1.5"/><rect x="6" y="-20" width="14" height="13" rx="2" fill="${PAINT[build.top] || '#ccc'}" stroke="${INK}" stroke-width="1.5"/>`;
    t.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)})`);
  }
  function hideTool() { const t = $('tool'); if (t) t.remove(); }

  let toolDown = false;
  scene.addEventListener('pointerdown', e => {
    if (phase !== 'build' || busy) return;
    if ((station === 1 && build.roof && !build.welded) || (station === 2 && build.top)) {
      toolDown = true; lastDot = null;
      scene.setPointerCapture(e.pointerId);
      toolMove(e);
    }
  });
  scene.addEventListener('pointermove', e => {
    if (phase !== 'build' || busy) return;
    if ((station === 1 && build.roof && !build.welded) || (station === 2 && build.top)) toolMove(e);
  });
  const toolUp = () => { toolDown = false; };
  scene.addEventListener('pointerup', toolUp);
  scene.addEventListener('pointercancel', toolUp);
  scene.addEventListener('pointerleave', () => { if (!toolDown) hideTool(); });
  function toolMove(e) {
    const sp = toSvg(scene, e.clientX, e.clientY);
    drawTool(sp.x, sp.y);
    if (!toolDown) return;
    const cp = toSvg($('carG'), e.clientX, e.clientY);
    if (station === 1) weldAt(cp.x, cp.y);
    else sprayAt(cp.x, cp.y);
  }

  // ================= effects =================
  function sparks(x, y, n, color) {
    const fx = $('fx');
    for (let i = 0; i < n; i++) {
      const c = svgEl('circle', { cx: x, cy: y, r: 1.6, fill: color }, fx);
      const a = Math.random() * Math.PI * 2, d = 10 + Math.random() * 18;
      c.animate([{ transform: 'translate(0,0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * d}px, ${Math.sin(a) * d + 8}px)`, opacity: 0 }], { duration: 380, easing: 'ease-out' });
      setTimeout(() => c.remove(), 400);
    }
  }
  function flashCar(color) {
    $('carG').animate([{ filter: `drop-shadow(0 0 6px ${color}) brightness(1.4)` }, { filter: 'none' }], { duration: 500 });
  }
  function flash(kind) { const f = $('flash'); f.className = 'flash'; void f.offsetWidth; f.className = 'flash ' + kind; }
  function shake() { const app = $('app'); app.classList.remove('shake'); void app.offsetWidth; app.classList.add('shake'); }
  function floatText(text, bad) {
    const el = document.createElement('div');
    el.className = 'float' + (bad ? ' cut' : '');
    el.textContent = text;
    $('counter').appendChild(el);
    setTimeout(() => el.remove(), 1100);
  }
  function wiggle(btn) { btn.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-5px)' }, { transform: 'translateX(5px)' }, { transform: 'translateX(0)' }], { duration: 200 }); }
  function press(btn) { if (!btn || btn.disabled) return; btn.classList.add('pressed'); setTimeout(() => btn.classList.remove('pressed'), 90); }

  // ================= rendering =================
  function renderHud() {
    const { m, d } = dateOf(G.day);
    $('dateVal').textContent = `${m}월 ${d}일 · ${SEASON[seasonOf(G.day)]}`;
    $('dayVal').textContent = `영업 ${G.day}일째 / ${YEAR}`;
    $('moneyVal').textContent = won(G.money);
    $('custVal').textContent = `${D.n}/${PER_DAY}`;
    const r = rating();
    $('ratingVal').textContent = '★' + r.toFixed(1);
    $('ratingBox').classList.toggle('danger', r < 3);
  }
  function renderLine() {
    const cur = phase === 'build' ? station : phase === 'deliver' || phase === 'result' ? 4 : -1;
    $('line').innerHTML = STATIONS.map((s, i) =>
      `<div class="st ${i < cur ? 'done' : i === cur ? 'now' : ''}">${i < cur ? '✓ ' : ''}${s.name}<small>${s.sub}</small></div>`).join('');
  }
  function renderTip() {
    const left = Math.max(0, C.tipWindow - C.elapsed), ratio = left / C.tipWindow;
    $('gaugeFill').style.width = ratio * 100 + '%';
    $('gauge').className = 'gauge' + (ratio <= 0.25 ? ' low' : ratio <= 0.55 ? ' mid' : '');
    $('tipVal').textContent = left > 0 ? `빠른 팁 ${Math.ceil(left)}초` : '팁 시간 끝';
  }

  function tick(ts) {
    const dt = last ? Math.min(0.1, (ts - last) / 1000) : 0;
    last = ts;
    if (phase === 'build' && C) { C.elapsed += dt; renderTip(); }
    requestAnimationFrame(tick);
  }

  // ================= input =================
  $('mainBtn').addEventListener('click', mainAction);
  $('scrapBtn').addEventListener('click', scrap);
  $('closeBtn').addEventListener('click', closeEarly);
  $('bubble').addEventListener('click', () => typeOut.finish && typeOut.finish());

  document.addEventListener('keydown', e => {
    const k = e.key;
    const confirmKey = k === 'Enter' || k === ' ';
    const isPart = e.target && e.target.classList && e.target.classList.contains('part');
    if ((confirmKey && !isPart) || k === 'Backspace' || /^[1-9]$/.test(k)) e.preventDefault();
    if (e.repeat || isPart && k === ' ') return;
    if (phase === 'arrive') { if (confirmKey && typeOut.finish) typeOut.finish(); return; }
    if (phase === 'contract' || phase === 'build') {
      if (/^[1-9]$/.test(k)) { const btn = $('tray').querySelector(`[data-i="${+k - 1}"]`); press(btn); useItem(ITEMS[+k - 1]); }
      else if (k === 'Enter') { press($('mainBtn')); mainAction(); }
      else if (k === 'Backspace') { press($('scrapBtn')); scrap(); }
      return;
    }
    if (phase === 'result') { if (confirmKey) afterResult(); return; }
    if (confirmKey) { const b = $('screen').querySelector('[data-act]'); if (b && !$('screen').hidden) act(b.dataset.act); }
  });

  splashScreen();
  requestAnimationFrame(tick);
})();
</script>
